name: Generate contribution snake

on:
  schedule:
    - cron: "0 5 * * *"   # once a day (00:00 Peru time)
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#9b0000&color_dots=#ebedf0,#f5b5bb,#e46b78,#c0182c,#76000d
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8001c&color_dots=#161616,#3d0000,#76000d,#9b0000,#e8001c

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

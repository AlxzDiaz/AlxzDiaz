<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" role="img" aria-label="Terminal session of alxz@localhost: whoami, focus, projects, interests and git status">
  <title>alxz@localhost — terminal</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#76000d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8001c" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#e8001c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 15px; }
    .title { fill: #777777; font-size: 12px; }
    .user { fill: #e8001c; }
    .host { fill: #9b0000; }
    .dim { fill: #777777; }
    .cmd { fill: #cbbfbf; }
    .out { fill: #cbbfbf; fill-opacity: 0.82; }
    .red { fill: #e8001c; }
    .quiet { fill: #777777; font-style: italic; }
    .line { opacity: 0; animation: show 0.35s ease-out forwards; }
    .l1 { animation-delay: 0.4s; }  .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.9s; }  .l4 { animation-delay: 2.6s; }
    .l5 { animation-delay: 3.4s; }  .l6 { animation-delay: 4.1s; }
    .l7 { animation-delay: 4.9s; }  .l8 { animation-delay: 5.6s; }
    .l9 { animation-delay: 6.4s; }  .l10 { animation-delay: 7.1s; }
    .l11 { animation-delay: 8.0s; } .l12 { animation-delay: 8.8s; }
    .cursor { fill: #e8001c; animation: blink 1.1s 9.2s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
  </style>

  <rect x="1" y="1" width="758" height="402" rx="10" fill="#0d0d0d" stroke="#76000d" stroke-width="1.2"/>
  <rect x="1" y="1" width="758" height="34" rx="10" fill="#050505"/>
  <rect x="1" y="25" width="758" height="10" fill="#050505"/>
  <rect x="1" y="35" width="758" height="1" fill="url(#bar)"/>
  <rect x="2" y="36" width="756" height="110" fill="url(#glow)"/>
  <rect x="2" y="36" width="756" height="366" fill="url(#scan)"/>
  <circle cx="22" cy="18" r="5" fill="#e8001c"/>
  <circle cx="40" cy="18" r="5" fill="#9b0000"/>
  <circle cx="58" cy="18" r="5" fill="#3d0000"/>
  <text x="380" y="22" text-anchor="middle" class="title">alxz@localhost: ~ · zsh · 01:47</text>

  <g transform="translate(26 0)">
    <text y="68" class="line l1"><tspan class="user">alxz</tspan><tspan class="dim">@</tspan><tspan class="host">localhost</tspan><tspan class="dim">:~$</tspan><tspan class="cmd" dx="9">whoami</tspan></text>
    <text y="92" x="18" class="line l2 out">alexzandro <tspan class="dim">—</tspan> systems engineering student</text>

    <text y="124" class="line l3"><tspan class="user">alxz</tspan><tspan class="dim">@</tspan><tspan class="host">localhost</tspan><tspan class="dim">:~$</tspan><tspan class="cmd" dx="9">cat focus.txt</tspan></text>
    <text y="148" x="18" class="line l4 out">web systems <tspan class="red">·</tspan> databases <tspan class="red">·</tspan> backend <tspan class="red">·</tspan> APIs <tspan class="red">·</tspan> architecture</text>

    <text y="180" class="line l5"><tspan class="user">alxz</tspan><tspan class="dim">@</tspan><tspan class="host">localhost</tspan><tspan class="dim">:~$</tspan><tspan class="cmd" dx="9">ls ./projects</tspan></text>
    <text y="204" class="line l6 out"><tspan x="18">agrotienda/</tspan><tspan x="144">la-esquinita/</tspan><tspan x="288">amaru/</tspan><tspan x="372">talento/</tspan><tspan x="474" class="dim">experiments/</tspan></text>

    <text y="236" class="line l7"><tspan class="user">alxz</tspan><tspan class="dim">@</tspan><tspan class="host">localhost</tspan><tspan class="dim">:~$</tspan><tspan class="cmd" dx="9">cat interests.txt</tspan></text>
    <text y="260" x="18" class="line l8 out">cinema <tspan class="red">·</tspan> literature <tspan class="red">·</tspan> music <tspan class="red">·</tspan> games <tspan class="red">·</tspan> design</text>

    <text y="292" class="line l9"><tspan class="user">alxz</tspan><tspan class="dim">@</tspan><tspan class="host">localhost</tspan><tspan class="dim">:~$</tspan><tspan class="cmd" dx="9">git status</tspan></text>
    <text y="316" x="18" class="line l10 out">learning <tspan class="red">·</tspan> building <tspan class="red">·</tspan> debugging</text>
    <text y="340" x="18" class="line l11 quiet">nothing finished yet.</text>

    <text y="376" class="line l12"><tspan class="user">alxz</tspan><tspan class="dim">@</tspan><tspan class="host">localhost</tspan><tspan class="dim">:~$</tspan><tspan class="cursor" dx="9">▌</tspan></text>
  </g>
</svg>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#76000d"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8001c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e8001c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 15px; }
    .title { fill: #777777; font-size: 12px; }
    .user { fill: #e8001c; }
    .path { fill: #9b0000; }
    .cmd { fill: #cbbfbf; }
    .out { fill: #cbbfbf; opacity: 0.85; }
    .dim { fill: #777777; }
    .red { fill: #e8001c; }
    .line { opacity: 0; animation: show 0.35s ease-out forwards; }
    .l1 { animation-delay: 0.4s; }  .l2 { animation-delay: 1.2s; }
    .l3 { animation-delay: 2.0s; }  .l4 { animation-delay: 2.8s; }
    .l5 { animation-delay: 3.6s; }  .l6 { animation-delay: 4.4s; }
    .l7 { animation-delay: 5.2s; }  .l8 { animation-delay: 6.0s; }
    .l9 { animation-delay: 6.8s; }
    .cursor { fill: #e8001c; animation: blink 1.1s 7.2s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
  </style>

